name: Release

# 触发方式：
#   1) 推送 v* 标签   -> 发布正式版 Release，资产 qihang-nav-<version>.zip
#   2) 推送 main/develop -> 发布/更新分支快照 Release（tag: <branch>-latest），资产 qihang-nav-<branch>.zip
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - develop

permissions:
  contents: write

env:
  PACKAGE_PATHS: manifest.json README.md LICENSE src doc server tools

jobs:
  # ---------------- 标签发布 ----------------
  tag-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: ver
        run: |
          VERSION="$(jq -r '.version' manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "manifest version: $VERSION"

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.ver.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 manifest.json 的 version $VERSION 不一致，请先统一版本号再打标签"
            exit 1
          fi

      - name: Package
        run: |
          NAME="qihang-nav-${{ steps.ver.outputs.version }}.zip"
          zip -r "$NAME" $PACKAGE_PATHS -x '*.DS_Store' '*__pycache__*' '*.pyc' 'dist/*' '*.log'
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "--- entries ---"
          unzip -Z1 "$NAME" | wc -l
          echo "--- backslash entries (must be 0) ---"
          unzip -Z1 "$NAME" | grep -c '\\' || true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists, updating asset"
            gh release upload "$GITHUB_REF_NAME" "$NAME" --clobber
          else
            echo "creating release $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" "$NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  # ---------------- 分支快照 ----------------
  branch-snapshot:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: ver
        run: |
          VERSION="$(jq -r '.version' manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          NAME="qihang-nav-${GITHUB_REF_NAME}.zip"
          zip -r "$NAME" $PACKAGE_PATHS -x '*.DS_Store' '*__pycache__*' '*.pyc' 'dist/*' '*.log'
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          unzip -Z1 "$NAME" | grep -c '\\' || true

      - name: Point <branch>-latest tag at current commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}-latest"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create or update branch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="分支：${GITHUB_REF_NAME}
          版本：${{ steps.ver.outputs.version }}
          提交：${GITHUB_SHA}
          构建：$(date -u +'%Y-%m-%d %H:%M UTC')
          说明：本 Release 每次推送自动更新，资产始终对应 ${GITHUB_REF_NAME} 分支最新提交，同名的旧资产会被覆盖。"

          # 分支快照一律标记 pre-release：避免抢占 releases/latest（正式版出口）
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "updating release $TAG"
            gh release upload "$TAG" "$NAME" --clobber
            gh release edit "$TAG" --notes "$BODY" --prerelease
          else
            echo "creating release $TAG"
            gh release create "$TAG" "$NAME" \
              --title "${GITHUB_REF_NAME} 分支最新构建" \
              --notes "$BODY" \
              --verify-tag \
              --prerelease
          fi
